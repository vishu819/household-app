<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Household" />
<meta name="theme-color" content="#0b1020" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preload" href="inter.woff2" as="font" type="font/woff2" crossorigin />
<title>Household</title>
<style>
  @font-face{font-family:'Inter';src:url('inter.woff2') format('woff2');font-weight:100 900;font-display:swap;font-style:normal;}
  :root{
    --bg:#0b1020; --bg2:#141b2e; --card:#161d31; --card2:#1e2740;
    --ink:#f3f5fb; --muted:#8a96b4; --line:#26304b;
    --accent:#5b8cff; --accent2:#7c5cff;
    --green:#3ddc97; --amber:#ffc44d; --red:#ff6b7d;
    --violet:#a78bfa; --pink:#f472b6; --orange:#fb923c;
    --grad:linear-gradient(135deg,#5b8cff 0%,#7c5cff 100%);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* Glow is baked into the html background as fixed radial gradients — one paint layer,
     no separate element, so it can never box, clip, or occlude. Covers the whole page. */
  html{margin:0;padding:0;min-height:100%;color:var(--ink);
    background-color:var(--bg);
    background-image:
      radial-gradient(340px 340px at 22% 12%, rgba(91,140,255,.28), transparent 70%),
      radial-gradient(320px 320px at 82% 42%, rgba(138,92,255,.24), transparent 70%),
      radial-gradient(300px 300px at 38% 78%, rgba(61,220,151,.16), transparent 70%);
    background-attachment:fixed;background-repeat:no-repeat;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-feature-settings:'cv11','ss01','tnum';letter-spacing:-.011em;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overscroll-behavior:none;}
  body{margin:0;padding:0;background:transparent;padding-top:var(--safe-t);}
  #app{max-width:560px;margin:0 auto;padding:0 16px 96px;min-height:100vh;min-height:100dvh;}
  h1{font-size:28px;font-weight:800;margin:16px 0 2px;letter-spacing:-.03em;padding-right:52px;
    background:linear-gradient(120deg,#fff,#c7d2fe);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  h2{font-size:15px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.06em;margin:22px 0 10px;}
  .sub{color:var(--muted);font-size:13px;margin:0 0 14px;}
  .card{background:rgba(30,39,64,.62);
    border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:16px;margin-bottom:12px;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.14), 0 8px 26px rgba(0,0,0,.3);transition:transform .12s ease;}
  .card.tap:active{transform:scale(.99);}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .muted{color:var(--muted);} .sm{font-size:13px;} .xs{font-size:11px;}
  .b{font-weight:700;} .amt{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.01em;}
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;}
  .p-green{background:rgba(61,220,151,.16);color:var(--green);}
  .p-amber{background:rgba(255,196,77,.16);color:var(--amber);}
  .p-red{background:rgba(255,107,125,.16);color:var(--red);}
  .p-blue{background:rgba(91,140,255,.18);color:#9db8ff;}
  .p-violet{background:rgba(167,139,250,.16);color:var(--violet);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:rgba(36,46,74,.66);
    border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:14px;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.16), 0 8px 22px rgba(0,0,0,.28);}
  .stat .n{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:flex;align-items:center;gap:5px;}
  .bar{height:9px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;margin-top:10px;}
  .bar > i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .35s cubic-bezier(.4,0,.2,1);}
  button{font-family:inherit;cursor:pointer;border:none;}
  .btn{background:var(--grad);color:#fff;font-weight:700;border-radius:14px;padding:13px 16px;font-size:15px;
    width:100%;box-shadow:0 6px 18px rgba(91,140,255,.35);transition:transform .1s ease,opacity .1s;}
  .btn:active{transform:scale(.98);opacity:.9;}
  .btn:disabled{opacity:.4;box-shadow:none;}
  .btn.ghost{background:rgba(255,255,255,.09);color:var(--ink);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 1px rgba(255,255,255,.2);}
  .btn.sm{padding:9px 13px;font-size:13px;width:auto;border-radius:11px;}
  .fab{position:fixed;right:calc(50% - 280px + 16px);bottom:calc(88px + var(--safe-b));
    width:58px;height:58px;border-radius:19px;background:var(--grad);color:#fff;font-size:30px;font-weight:300;
    display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(124,92,255,.5);z-index:40;transition:transform .1s;}
  .fab:active{transform:scale(.92);}
  @media(max-width:592px){.fab{right:16px;}}
  .eye{position:fixed;top:calc(var(--safe-t) + 18px);right:calc(50% - 280px + 16px);
    width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.10);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.18);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.3);
    display:flex;align-items:center;justify-content:center;z-index:45;color:var(--muted);transition:transform .1s;}
  .eye:active{transform:scale(.9);}
  .eye svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  @media(max-width:592px){.eye{right:16px;}}
  #tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(13,18,34,.82);
    backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
    border-top:1px solid rgba(255,255,255,.12);
    padding:8px 0 calc(8px + var(--safe-b));z-index:50;}
  #tabs .inner{max-width:560px;margin:0 auto;display:flex;justify-content:space-around;}
  .tab{background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10px;font-weight:600;padding:6px 6px;flex:1;border-radius:12px;transition:color .15s;}
  .tab.active{color:#fff;}
  .tab.active .ic{background:var(--grad);box-shadow:0 4px 12px rgba(91,140,255,.4);}
  .tab.active .ic svg{color:#fff;}
  .tab .ic{width:40px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:11px;transition:background .15s;}
  .tab .ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;}
  .tick{width:27px;height:27px;border-radius:9px;border:2px solid var(--line);background:transparent;
    display:flex;align-items:center;justify-content:center;color:transparent;font-size:15px;font-weight:900;flex:0 0 auto;transition:all .15s;}
  .tick.on{background:linear-gradient(135deg,var(--green),#2bb97f);border-color:transparent;color:#04231a;}
  .exp{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
  .exp:last-child{border-bottom:none;}
  .exp.paid .nm{text-decoration:line-through;color:var(--muted);}
  .split-col{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:9px 11px;margin:6px 0;}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end;}
  #modal.show{display:flex;}
  #modal.show .sheet{animation:sheetUp .28s cubic-bezier(.32,.72,0,1);}
  @keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .sheet{background:rgba(30,39,64,.75);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
    width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;
    padding:20px 18px calc(20px + var(--safe-b));max-height:88vh;overflow:auto;
    border-top:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 1px rgba(255,255,255,.2), 0 -8px 40px rgba(0,0,0,.5);}
  .sheet::before{content:"";display:block;width:38px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px;}
  .sheet h3{margin:0 0 14px;font-size:20px;font-weight:800;letter-spacing:-.02em;}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:600;}
  input,select{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:var(--ink);
    border-radius:10px;padding:12px;font-size:16px;font-family:inherit;}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.2);}
  .del{color:var(--red);background:none;font-size:14px;font-weight:700;padding:10px;width:100%;margin-top:8px;}
  a{color:var(--accent);}
  .donut{display:block;margin:0 auto;}
  .legend{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
  .legend .d{width:12px;height:12px;border-radius:3px;flex:0 0 auto;}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px;}
  .install-tip{background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:13px;color:var(--muted);margin-bottom:12px;}
  .subrow{display:flex;align-items:center;gap:8px;margin:8px 0;}
  .subrow input{flex:1;} .subrow select{width:auto;min-width:108px;}
  .subrow .x{background:none;color:var(--red);font-size:20px;width:32px;flex:0 0 auto;}
  .tag{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700;}
  .t-invest{background:rgba(91,140,255,.18);color:#9db8ff;}
  .t-insure{background:rgba(255,196,77,.16);color:var(--amber);}
  .t-expense{background:rgba(255,107,125,.16);color:var(--red);}
  .t-savings{background:rgba(61,220,151,.16);color:var(--green);}
  .flow{display:flex;flex-direction:column;gap:6px;}
  .flow .step{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;border-radius:10px;background:var(--card2);}
  .flow .arrow{text-align:center;color:var(--muted);font-size:12px;margin:-2px 0;}
  .barrow{margin:12px 0;}
  .barrow .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
  .cmp{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px;}
  .cmp .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;}
  .cmp .stk{width:70%;border-radius:6px 6px 0 0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;}
  .cmp .lbl{font-size:10px;color:var(--muted);}
  .seg{display:flex;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 1px rgba(255,255,255,.18);border-radius:14px;padding:5px;gap:4px;margin-bottom:14px;}
  .seg button{flex:1;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:8px;border-radius:9px;}
  .seg button.on{background:var(--grad);color:#fff;}
  .ava{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;
    background:var(--card2);border:1.5px solid var(--line);font-size:14px;line-height:1;flex:0 0 auto;}
  .ava.big{width:38px;height:38px;font-size:22px;border-radius:12px;}
  .link{font-size:10px;color:#9db8ff;}
  .propbar{display:flex;height:9px;border-radius:99px;overflow:hidden;margin:13px 0 9px;background:rgba(255,255,255,.06);}
  .propbar>span{height:100%;}
  .legend-row{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);}
  .legend-row span{display:flex;align-items:center;gap:4px;}
  .expandbar{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);}
  .iconbtn{background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 1px rgba(255,255,255,.2);border-radius:10px;width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .iconbtn:active{transform:scale(.9);}
</style>
</head>
<body>
<div id="app"></div>
<button class="eye" id="eye" onclick="toggleHide()" aria-label="Hide amounts"></button>
<button class="fab" id="fab" onclick="onFab()">+</button>
<nav id="tabs"><div class="inner">
  <button class="tab" data-tab="home"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg></span>Home</button>
  <button class="tab" data-tab="split"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17"/><path d="M12 12 18 8"/></svg></span>Split</button>
  <button class="tab" data-tab="expenses"><span class="ic"><svg viewBox="0 0 24 24"><path d="M9 11.5l2 2 4-4.5"/><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 3.5V6M16 3.5V6"/></svg></span>Expenses</button>
  <button class="tab" data-tab="analytics"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 20V4"/><path d="M4 20h16"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg></span>Analytics</button>
  <button class="tab" data-tab="savings"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 9.5 12 4l8 5.5"/><path d="M4 9.5h16"/><path d="M6.5 12v6M11 12v6M17.5 12v6"/><path d="M4 20.5h16"/></svg></span>Savings</button>
  <button class="tab" data-tab="sync"><span class="ic" id="syncIc"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V7a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></span>Settings</button>
</div></nav>
<div id="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="sheet" id="sheet"></div></div>

<script src="app.js"></script>
<script src="views.js"></script>
<script>load();loadSync();render();
if(sync.enabled){startPull();syncPull(true);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sync.enabled)syncPull(true);});
window.addEventListener('focus',()=>{if(sync.enabled)syncPull(true);});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>


</body>
</html>
