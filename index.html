<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />

<title>Household</title>
<style>
  @font-face{font-family:'Inter';src:url('inter.woff2') format('woff2');font-weight:100 900;font-display:swap;font-style:normal;}
  :root{
    --bg:#0b1020; --bg2:#141b2e; --card:#161d31; --card2:#1e2740;
    --ink:#f3f5fb; --muted:#8a96b4; --line:#26304b;
    --accent:#5b8cff; --accent2:#7c5cff;
    --green:#3ddc97; --amber:#ffc44d; --red:#ff6b7d;
    --violet:#a78bfa; --pink:#f472b6; --orange:#fb923c;
    --grad:linear-gradient(135deg,#5b8cff 0%,#7c5cff 100%);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* Glow is baked into the html background as fixed radial gradients — one paint layer,
     no separate element, so it can never box, clip, or occlude. Covers the whole page. */
  html{margin:0;padding:0;min-height:100%;color:var(--ink);
    background-color:var(--bg);
    background-image:
      radial-gradient(340px 340px at 22% 12%, rgba(91,140,255,.28), transparent 70%),
      radial-gradient(320px 320px at 82% 42%, rgba(138,92,255,.24), transparent 70%),
      radial-gradient(300px 300px at 38% 78%, rgba(61,220,151,.16), transparent 70%);
    background-attachment:fixed;background-repeat:no-repeat;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-feature-settings:'cv11','ss01','tnum';letter-spacing:-.011em;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overscroll-behavior:none;}
  body{margin:0;padding:0;background:transparent;padding-top:var(--safe-t);}
  #app{max-width:560px;margin:0 auto;padding:0 16px 96px;min-height:100vh;min-height:100dvh;}
  h1{font-size:28px;font-weight:800;margin:16px 0 2px;letter-spacing:-.03em;padding-right:52px;
    background:linear-gradient(120deg,#fff,#c7d2fe);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  h2{font-size:15px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.06em;margin:22px 0 10px;}
  .sub{color:var(--muted);font-size:13px;margin:0 0 14px;}
  .card{background:rgba(30,39,64,.62);
    border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:16px;margin-bottom:12px;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.14), 0 8px 26px rgba(0,0,0,.3);transition:transform .12s ease;}
  .card.tap:active{transform:scale(.99);}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .muted{color:var(--muted);} .sm{font-size:13px;} .xs{font-size:11px;}
  .b{font-weight:700;} .amt{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.01em;}
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;}
  .p-green{background:rgba(61,220,151,.16);color:var(--green);}
  .p-amber{background:rgba(255,196,77,.16);color:var(--amber);}
  .p-red{background:rgba(255,107,125,.16);color:var(--red);}
  .p-blue{background:rgba(91,140,255,.18);color:#9db8ff;}
  .p-violet{background:rgba(167,139,250,.16);color:var(--violet);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:rgba(36,46,74,.66);
    border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:14px;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.16), 0 8px 22px rgba(0,0,0,.28);}
  .stat .n{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:flex;align-items:center;gap:5px;}
  .bar{height:9px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;margin-top:10px;}
  .bar > i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .35s cubic-bezier(.4,0,.2,1);}
  button{font-family:inherit;cursor:pointer;border:none;}
  .btn{background:var(--grad);color:#fff;font-weight:700;border-radius:14px;padding:13px 16px;font-size:15px;
    width:100%;box-shadow:0 6px 18px rgba(91,140,255,.35);transition:transform .1s ease,opacity .1s;}
  .btn:active{transform:scale(.98);opacity:.9;}
  .btn:disabled{opacity:.4;box-shadow:none;}
  .btn.ghost{background:rgba(255,255,255,.09);color:var(--ink);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 1px rgba(255,255,255,.2);}
  .btn.sm{padding:9px 13px;font-size:13px;width:auto;border-radius:11px;}
  .fab{position:fixed;right:calc(50% - 280px + 16px);bottom:calc(88px + var(--safe-b));
    width:58px;height:58px;border-radius:19px;background:var(--grad);color:#fff;font-size:30px;font-weight:300;
    display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(124,92,255,.5);z-index:40;transition:transform .1s;}
  .fab:active{transform:scale(.92);}
  @media(max-width:592px){.fab{right:16px;}}
  .eye{position:fixed;top:calc(var(--safe-t) + 18px);right:calc(50% - 280px + 16px);
    width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.10);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.18);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.3);
    display:flex;align-items:center;justify-content:center;z-index:45;color:var(--muted);transition:transform .1s;}
  .eye:active{transform:scale(.9);}
  .eye svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  @media(max-width:592px){.eye{right:16px;}}
  #tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(13,18,34,.82);
    backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
    border-top:1px solid rgba(255,255,255,.12);
    padding:8px 0 calc(8px + var(--safe-b));z-index:50;}
  #tabs .inner{max-width:560px;margin:0 auto;display:flex;justify-content:space-around;}
  .tab{background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10px;font-weight:600;padding:6px 6px;flex:1;border-radius:12px;transition:color .15s;}
  .tab.active{color:#fff;}
  .tab.active .ic{background:var(--grad);box-shadow:0 4px 12px rgba(91,140,255,.4);}
  .tab.active .ic svg{color:#fff;}
  .tab .ic{width:40px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:11px;transition:background .15s;}
  .tab .ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;}
  .tick{width:27px;height:27px;border-radius:9px;border:2px solid var(--line);background:transparent;
    display:flex;align-items:center;justify-content:center;color:transparent;font-size:15px;font-weight:900;flex:0 0 auto;transition:all .15s;}
  .tick.on{background:linear-gradient(135deg,var(--green),#2bb97f);border-color:transparent;color:#04231a;}
  .exp{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
  .exp:last-child{border-bottom:none;}
  .exp.paid .nm{text-decoration:line-through;color:var(--muted);}
  .split-col{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:9px 11px;margin:6px 0;}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end;}
  #modal.show{display:flex;}
  #modal.show .sheet{animation:sheetUp .28s cubic-bezier(.32,.72,0,1);}
  @keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .sheet{background:rgba(30,39,64,.75);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
    width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;
    padding:20px 18px calc(20px + var(--safe-b));max-height:88vh;overflow:auto;
    border-top:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 1px rgba(255,255,255,.2), 0 -8px 40px rgba(0,0,0,.5);}
  .sheet::before{content:"";display:block;width:38px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px;}
  .sheet h3{margin:0 0 14px;font-size:20px;font-weight:800;letter-spacing:-.02em;}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:600;}
  input,select{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:var(--ink);
    border-radius:10px;padding:12px;font-size:16px;font-family:inherit;}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.2);}
  .del{color:var(--red);background:none;font-size:14px;font-weight:700;padding:10px;width:100%;margin-top:8px;}
  a{color:var(--accent);}
  .donut{display:block;margin:0 auto;}
  .legend{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
  .legend .d{width:12px;height:12px;border-radius:3px;flex:0 0 auto;}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px;}
  .install-tip{background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:13px;color:var(--muted);margin-bottom:12px;}
  .subrow{display:flex;align-items:center;gap:8px;margin:8px 0;}
  .subrow input{flex:1;} .subrow select{width:auto;min-width:108px;}
  .subrow .x{background:none;color:var(--red);font-size:20px;width:32px;flex:0 0 auto;}
  .tag{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700;}
  .t-invest{background:rgba(91,140,255,.18);color:#9db8ff;}
  .t-insure{background:rgba(255,196,77,.16);color:var(--amber);}
  .t-expense{background:rgba(255,107,125,.16);color:var(--red);}
  .t-savings{background:rgba(61,220,151,.16);color:var(--green);}
  .flow{display:flex;flex-direction:column;gap:6px;}
  .flow .step{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;border-radius:10px;background:var(--card2);}
  .flow .arrow{text-align:center;color:var(--muted);font-size:12px;margin:-2px 0;}
  .barrow{margin:12px 0;}
  .barrow .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
  .cmp{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px;}
  .cmp .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;}
  .cmp .stk{width:70%;border-radius:6px 6px 0 0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;}
  .cmp .lbl{font-size:10px;color:var(--muted);}
  .seg{display:flex;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 1px rgba(255,255,255,.18);border-radius:14px;padding:5px;gap:4px;margin-bottom:14px;}
  .seg button{flex:1;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:8px;border-radius:9px;}
  .seg button.on{background:var(--grad);color:#fff;}
  .ava{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;
    background:var(--card2);border:1.5px solid var(--line);font-size:14px;line-height:1;flex:0 0 auto;}
  .ava.big{width:38px;height:38px;font-size:22px;border-radius:12px;}
  .link{font-size:10px;color:#9db8ff;}
  .propbar{display:flex;height:9px;border-radius:99px;overflow:hidden;margin:13px 0 9px;background:rgba(255,255,255,.06);}
  .propbar>span{height:100%;}
  .legend-row{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);}
  .legend-row span{display:flex;align-items:center;gap:4px;}
  .expandbar{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);}
  .iconbtn{background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 1px rgba(255,255,255,.2);border-radius:10px;width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .iconbtn:active{transform:scale(.9);}
</style>
</head>
<body>
<div id="app"></div>
<button class="eye" id="eye" onclick="toggleHide()" aria-label="Hide amounts"></button>
<button class="fab" id="fab" onclick="onFab()">+</button>
<nav id="tabs"><div class="inner">
  <button class="tab" data-tab="home"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg></span>Home</button>
  <button class="tab" data-tab="split"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17"/><path d="M12 12 18 8"/></svg></span>Split</button>
  <button class="tab" data-tab="expenses"><span class="ic"><svg viewBox="0 0 24 24"><path d="M9 11.5l2 2 4-4.5"/><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 3.5V6M16 3.5V6"/></svg></span>Expenses</button>
  <button class="tab" data-tab="analytics"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 20V4"/><path d="M4 20h16"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg></span>Analytics</button>
  <button class="tab" data-tab="savings"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 9.5 12 4l8 5.5"/><path d="M4 9.5h16"/><path d="M6.5 12v6M11 12v6M17.5 12v6"/><path d="M4 20.5h16"/></svg></span>Savings</button>
  <button class="tab" data-tab="sync"><span class="ic" id="syncIc"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V7a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></span>Settings</button>
</div></nav>
<div id="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="sheet" id="sheet"></div></div>

<script>
/* ============ storage ============ */
const KEY='family-finance-v1';
let hideMoney=(localStorage.getItem('hideMoney')==='1');
const fmt=(n)=>hideMoney?'₹•••••':'₹'+Math.round(Number(n||0)).toLocaleString('en-IN');
function toggleHide(){hideMoney=!hideMoney;localStorage.setItem('hideMoney',hideMoney?'1':'0');render();}
const uid=()=>Math.random().toString(36).slice(2,10);

/* ---- IST-locked time. The app's "now" is always Asia/Kolkata regardless of device tz. ---- */
function istNow(){
  // Convert current instant to IST wall-clock by formatting in that timezone.
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value;
  return {y:+g('year'),m:+g('month'),d:+g('day')};
}
const thisMonth=()=>{const n=istNow();return n.y+'-'+String(n.m).padStart(2,'0');};
const istToday=()=>{const n=istNow();return n.y+'-'+String(n.m).padStart(2,'0')+'-'+String(n.d).padStart(2,'0');};

let viewMonth=thisMonth();
const curMonth=()=>viewMonth;
function shiftMonth(m,delta){let [y,mo]=m.split('-').map(Number);mo+=delta;if(mo<1){mo=12;y--;}if(mo>12){mo=1;y++;}return y+'-'+String(mo).padStart(2,'0');}
function monthLabel(m){const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});}
// Check if today (IST) is the last working day (Mon-Fri) of the current month.
// On that day, the next month unlocks as a draft — you can start setting it up.
function isLastWorkingDay(){
  const n=istNow();
  const last=new Date(n.y,n.m,0); // last day of current month (n.m is 1-indexed)
  const dow=last.getDay();let d=last.getDate();
  if(dow===0)d-=2;else if(dow===6)d-=1; // Sunday→Fri, Saturday→Fri
  return n.d===d;
}
// A month is in the future (relative to real IST current month) if it sorts after it.
// Exception: on the last working day, the immediate next month is draftable.
function isFutureMonth(m){
  if(m<=thisMonth())return false;
  if(m===shiftMonth(thisMonth(),1)&&isLastWorkingDay())return false;
  return true;
}
function changeMonth(delta){
  const target=shiftMonth(viewMonth,delta);
  if(isFutureMonth(target)){alert("That month hasn't started yet. Come back on the 1st (or the last working day for a draft).");return;}
  // Auto-carry-forward when navigating to an empty draft month from a populated source
  if(target>viewMonth&&!DB.budgets.some(b=>b.month===target)&&!DB.expenses.some(e=>e.month===target)){
    carryForward(viewMonth,target);
  }
  viewMonth=target;render();
}
function monthBar(){
  const nextIsFuture=isFutureMonth(shiftMonth(viewMonth,1));
  return `<div class="row" style="margin:0 0 14px;background:var(--card2);border-radius:12px;padding:6px">
    <button class="btn sm ghost" style="width:auto" onclick="changeMonth(-1)">‹</button>
    <span class="b" style="font-size:15px">${monthLabel(viewMonth)}${viewMonth===thisMonth()?'':''}</span>
    <button class="btn sm ghost" style="width:auto${nextIsFuture?';opacity:.35':''}" ${nextIsFuture?'disabled':''} onclick="changeMonth(1)">›</button>
  </div>`;
}

/* ---- Reset month: blank or carry forward from previous. ---- */
function resetMonth(){
  const m=curMonth(),prev=shiftMonth(m,-1);
  if(!confirm(`Reset ${monthLabel(m)}?\n\nAll budgets and expenses for this month will be removed.`))return;
  const choice=confirm('Cancel = blank reset. OK = carry forward from previous month.');
  DB.budgets=DB.budgets.filter(b=>b.month!==m);
  DB.expenses=DB.expenses.filter(e=>e.month!==m);
  if(choice)carryForward(prev,m);
  save();render();
}
/* ---- Carry forward: copy budgets & expenses from one month to another. ---- */
function carryForward(from,to){
  const existingEx=DB.expenses.filter(e=>e.month===to);
  const existingBd=DB.budgets.filter(b=>b.month===to);
  let n=0;
  DB.expenses.filter(e=>e.month===from).forEach(e=>{
    if(existingEx.some(x=>x.name===e.name&&x.paidBy===e.paidBy))return;
    DB.expenses.push({...e,id:uid(),month:to,paid:false,paidDate:null});n++;
  });
  DB.budgets.filter(b=>b.month===from).forEach(b=>{
    if(existingBd.some(x=>x.person===b.person))return;
    DB.budgets.push({...b,id:uid(),month:to,fixedItems:(b.fixedItems||[]).map(i=>({...i}))});n++;
  });
  if(n)save();
}
/* ---- Start next month: draft from last working day, or from the 1st. ---- */
function startNewMonth(){
  const from=viewMonth, to=shiftMonth(viewMonth,1);
  if(isFutureMonth(to)){alert(`${monthLabel(to)} isn't available yet. It opens on the 1st (or the last working day for a draft).`);return;}
  const before=DB.budgets.filter(b=>b.month===to).length+DB.expenses.filter(e=>e.month===to).length;
  carryForward(from,to);
  viewMonth=to;render();
  const after=DB.budgets.filter(b=>b.month===to).length+DB.expenses.filter(e=>e.month===to).length;
  alert(after>before?`Started ${monthLabel(to)} — copied ${after-before} item(s) forward.`
             :`${monthLabel(to)} already set up.`);
}

/* ============ seed ============ */
const SUB_TYPES=['Investment','Insurance','Expense','Savings']; // subcategory tags
const SUB_TAGCLASS={Investment:'t-invest',Insurance:'t-insure',Expense:'t-expense',Savings:'t-savings'};

function seed(){
  return {
    savingsTypes:['FD','Arbitrage Fund','Liquid Fund','Mutual Fund','Recurring Deposit','Gold'],
    people:[], budgets:[], expenses:[], savings:[]
  };
}

let DB;
function migrate(){
  // Bring older data blobs up to the new model without losing anything.
  if(!DB.savingsTypes)DB.savingsTypes=['FD','Arbitrage Fund','Liquid Fund','Mutual Fund','Recurring Deposit','Gold'];
  if(!DB.savings&&DB.fds){DB.savings=DB.fds.map(f=>({...f,type:f.type||'FD'}));delete DB.fds;}
  if(!DB.savings)DB.savings=[];
  const AV=['👨🏻','👩🏻','👵🏻','🧓🏻','🧑🏻','👦🏻','👧🏻'];
  (DB.people||[]).forEach((p,i)=>{if(p.commonPct==null){p.commonPct=50;p.personalPct=50;}if(!p.avatar)p.avatar=AV[i%AV.length];if(!p.id)p.id='p_'+uid();});
  // convert legacy budgets to salary model; ensure each fixedItem has a stable key
  (DB.budgets||[]).forEach(b=>{
    if(b.salary==null){
      const fixed=(b.fixedItems||[]).reduce((s,i)=>s+(i.a||0),0);
      b.salary=(b.common||0)+fixed+(b.personal||0)+(b.prepayment||0)+(b.buffer||0);
      delete b.common;delete b.fixed;delete b.personal;delete b.prepayment;delete b.buffer;
    }
    b.fixedItems=(b.fixedItems||[]).map(i=>({k:i.k||uid(),n:i.n,a:i.a,t:i.t||'Expense'}));
  });
  (DB.expenses||[]).forEach(e=>{
    if(!e.account)e.account='Common';
    if(!e.kind)e.kind='fixed';               // legacy expenses were all tickable/fixed
    if(e.kind==='fixed'&&e.linkSub===undefined)e.linkSub=null;
    if(e.kind==='extra'){e.account='Common';if(!e.date)e.date=(e.month||thisMonth())+'-01';}
  });
}
const BACKUP_KEY='family-finance-lastgood';
let lastSerialized='';        // used for sync dirty-check
function load(){
  try{const raw=localStorage.getItem(KEY);DB=raw?JSON.parse(raw):seed();}
  catch(e){
    // corrupt data — try last-known-good before falling back to seed
    try{const bg=localStorage.getItem(BACKUP_KEY);DB=bg?JSON.parse(bg):seed();}catch(e2){DB=seed();}
  }
  migrate();
  if(!DB.rev)DB.rev=1;
  lastSerialized=JSON.stringify(DB);
  localStorage.setItem(BACKUP_KEY,lastSerialized); // snapshot known-good on load
}
function save(){
  DB.rev=(DB.rev||0)+1;
  DB.updatedAt=nowISO();
  migrate();
  const s=JSON.stringify(DB);
  localStorage.setItem(BACKUP_KEY,localStorage.getItem(KEY)||s); // previous good state kept as backup
  localStorage.setItem(KEY,s);
  if(s.length>200000)console.warn('[household] data blob is '+Math.round(s.length/1024)+'KB — consider archiving old months.');
  syncPush();
}

/* ============ split math ============ */
function splitFor(b){
  const p=(DB.people.find(x=>x.name===b.person))||{commonPct:50,personalPct:50};
  const fixed=(b.fixedItems||[]).reduce((s,i)=>s+(i.a||0),0);
  const remainder=Math.max(0,(b.salary||0)-fixed);
  const commonPct=p.commonPct??50, personalPct=p.personalPct??(100-commonPct);
  const commonSave=remainder*commonPct/100;
  const personalSave=remainder*personalPct/100;
  // tag totals from fixed subcategories
  let invest=0,insure=0,fixExp=0,fixSave=0;
  (b.fixedItems||[]).forEach(i=>{
    if(i.t==='Investment')invest+=i.a; else if(i.t==='Insurance')insure+=i.a;
    else if(i.t==='Savings')fixSave+=i.a; else fixExp+=i.a;
  });
  return {fixed,remainder,commonPct,personalPct,commonSave,personalSave,invest,insure,fixExp,fixSave,salary:b.salary||0};
}
// Extra (unplanned, common) spend for a month — a joint concept, dips into common savings.
function extraCommon(month){return DB.expenses.filter(e=>e.month===month&&e.kind==='extra').reduce((s,e)=>s+(e.amount||0),0);}

// Per-person analytics from the DECLARED plan only (fixed expenses are already in the split,
// so ticking doesn't add new money). Extra common spend is handled at month level.
function analyticsFor(b){
  const s=splitFor(b);
  const salary=s.salary||0;
  return {salary,
    invested:s.invest,                                  // investment-tagged fixed
    saved:s.commonSave+s.personalSave+s.fixSave,        // split savings + savings-tagged fixed
    commonSave:s.commonSave, personalSave:s.personalSave,
    expense:s.fixExp+s.insure,                          // expense+insurance tagged fixed
    saveRate:salary?(s.commonSave+s.personalSave+s.fixSave)/salary:0,
    investRate:salary?s.invest/salary:0,
    expRate:salary?(s.fixExp+s.insure)/salary:0};
}
function analyticsMonth(month){
  const bs=DB.budgets.filter(b=>b.month===month);
  const agg={salary:0,invested:0,declaredSaved:0,commonSave:0,expense:0};
  bs.forEach(b=>{const a=analyticsFor(b);agg.salary+=a.salary;agg.invested+=a.invested;
    agg.declaredSaved+=a.saved;agg.commonSave+=a.commonSave;agg.expense+=a.expense;});
  const extra=extraCommon(month);                       // unplanned common spend
  agg.extra=extra;
  agg.effectiveCommon=agg.commonSave-extra;             // common savings after dipping for extras
  agg.saved=agg.declaredSaved-extra;                    // effective total savings
  agg.expense=agg.expense+extra;                        // total money spent incl. unplanned
  agg.saveRate=agg.salary?agg.saved/agg.salary:0;
  agg.investRate=agg.salary?agg.invested/agg.salary:0;
  agg.expRate=agg.salary?agg.expense/agg.salary:0;
  return agg;
}

function syncPush(){

        <span class="amt">${fmt(e.amount)}</span></div>`;});h+=`</div>`;}

  }

/* ---- Analytics ---- */
let anMode='combined'; // combined | <person name>
function setAnMode(m){anMode=m;render();}
function donut(items){
  const R=52,C=2*Math.PI*R;let off=0,seg='';
  const tot=items.reduce((s,i)=>s+i.v,0)||1;
  items.forEach(it=>{const len=C*it.v/tot;
    seg+=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${it.color}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=len;});
  return `<svg class="donut" width="150" height="150" viewBox="0 0 120 120">${seg}<circle r="36" cx="60" cy="60" fill="var(--bg)"/></svg>`;
}
function viewAnalytics(){
  const people=DB.people.filter(p=>DB.budgets.some(b=>b.person===p.name));
  let h=`<h1>Analytics</h1><p class="sub">Saving · investing · expenses</p>`+monthBar();
  // mode selector
  h+=`<div class="seg"><button class="${anMode==='combined'?'on':''}" onclick="setAnMode('combined')">Combined</button>`;
  people.forEach(p=>h+=`<button class="${anMode===p.name?'on':''}" onclick="setAnMode('${esc(p.name)}')">${p.avatar||''} ${esc(p.name)}</button>`);
  h+=`</div>`;

  let a;
  if(anMode==='combined')a=analyticsMonth(curMonth());
  else{const b=DB.budgets.find(x=>x.month===curMonth()&&x.person===anMode);a=b?analyticsFor(b):{salary:0,saved:0,invested:0,expense:0,saveRate:0,investRate:0,expRate:0};}

  h+=`<div class="grid2">
    <div class="stat"><div class="l">${icon('wallet','var(--muted)',14)} Income</div><div class="n">${fmt(a.salary)}</div></div>
    <div class="stat"><div class="l" style="color:var(--green)">${icon('save','var(--green)',14)} Saving rate</div><div class="n" style="color:var(--green)">${pct(a.saveRate)}</div></div>
    <div class="stat"><div class="l" style="color:var(--accent)">${icon('invest','var(--accent)',14)} Invest rate</div><div class="n" style="color:var(--accent)">${pct(a.investRate)}</div></div>
    <div class="stat"><div class="l" style="color:var(--red)">${icon('expense','var(--red)',14)} Expense rate</div><div class="n" style="color:var(--red)">${pct(a.expRate)}</div></div>
  </div>`;

  // Common savings pool: declared - unplanned extra = effective (combined only)
  if(anMode==='combined'){
    const neg=a.effectiveCommon<0;
    h+=`<h2>Common savings pool</h2><div class="card">
      <div class="split-col"><span class="sm">Declared common savings</span><span class="amt sm">${fmt(a.commonSave)}</span></div>
      <div class="split-col"><span class="sm">− Unplanned common spend</span><span class="amt sm" style="color:var(--red)">${fmt(a.extra)}</span></div>
      <div class="split-col" style="background:${neg?'rgba(255,107,125,.12)':'rgba(61,220,151,.10)'}"><span class="b">= Effective common savings</span><span class="amt" style="color:${neg?'var(--red)':'var(--green)'}">${fmt(a.effectiveCommon)}</span></div>
      ${neg?`<p class="xs" style="color:var(--red);margin:8px 0 0">⚠️ Unplanned spend exceeded the joint pool this month.</p>`:''}
    </div>`;
  }

  // breakdown donut
  const parts=[{k:'Saved',v:a.saved,color:'#3ddc97'},{k:'Invested',v:a.invested,color:'#5b8cff'},{k:'Expenses',v:a.expense,color:'#ff6b7d'}];
  h+=`<h2>Where the income goes</h2><div class="card"><div class="row" style="align-items:flex-start">${donut(parts)}
    <div class="legend" style="flex:1">`;
  parts.forEach(p=>h+=`<div class="row"><span style="display:flex;align-items:center;gap:8px"><span class="d" style="background:${p.color}"></span>${p.k}</span><span class="b sm">${fmt(p.v)}</span></div>`);
  const leftover=a.salary-a.saved-a.invested-a.expense;
  if(Math.abs(leftover)>1)h+=`<div class="row"><span class="muted sm">Unallocated</span><span class="b sm">${fmt(leftover)}</span></div>`;
  h+=`</div></div>`;

  // month-over-month comparison (last 6 months up to current)
  const months=[];let m=curMonth();for(let i=0;i<6;i++){months.unshift(m);m=shiftMonth(m,-1);}
  const series=months.map(mm=>{
    if(anMode==='combined')return {m:mm,...analyticsMonth(mm)};
    const b=DB.budgets.find(x=>x.month===mm&&x.person===anMode);return {m:mm,...(b?analyticsFor(b):{saved:0,invested:0,expense:0,salary:0})};
  });
  const maxV=Math.max(1,...series.map(s=>s.saved+s.invested+s.expense));
  h+=`<h2>Last 6 months</h2><div class="card"><div class="cmp">`;
  series.forEach(s=>{const H=x=>Math.round(x/maxV*100);
    h+=`<div class="col"><div class="stk" style="height:${H(s.saved+s.invested+s.expense)}%">
        <div style="background:#ff6b7d;height:${s.saved+s.invested+s.expense?H(s.expense)/Math.max(H(s.saved+s.invested+s.expense),1)*100:0}%"></div>
        <div style="background:#5b8cff;flex:${s.invested}"></div>
        <div style="background:#3ddc97;flex:${s.saved}"></div>
      </div><div class="lbl">${s.m.split('-')[1]}/${s.m.split('-')[0].slice(2)}</div></div>`;});
  h+=`</div><div class="row xs muted" style="margin-top:10px;justify-content:center;gap:14px">
      <span><span style="color:#3ddc97">●</span> Saved</span><span><span style="color:#5b8cff">●</span> Invested</span><span><span style="color:#ff6b7d">●</span> Expenses</span></div></div>`;

  // per-person quick compare (combined mode only)
  if(anMode==='combined'&&people.length>1){
    h+=`<h2>By person</h2>`;
    people.forEach(p=>{const b=DB.budgets.find(x=>x.month===curMonth()&&x.person===p.name);if(!b)return;const pa=analyticsFor(b);
      h+=`<div class="card"><div class="row"><span class="b" style="color:${p.color}">${esc(p.name)}</span><span class="amt sm">${fmt(pa.salary)}</span></div>
        <div class="barrow"><div class="top"><span class="muted">Saving ${pct(pa.saveRate)}</span><span class="muted">Invest ${pct(pa.investRate)}</span></div>
        <div class="bar"><i style="width:${Math.round((pa.saveRate+pa.investRate)*100)}%"></i></div></div></div>`;});
  }
  return h;
}

function togglePaid(id){
  const e=DB.expenses.find(x=>x.id===id);if(!e)return;
  e.paid=!e.paid;e.paidDate=e.paid?nowISO():null;save();
  // Targeted DOM update for the tapped row (avoids rebuilding the whole screen on every tick).
  const btn=document.querySelector(`.tick[onclick*="${id}"]`);
  const rowEl=btn&&btn.closest('.exp');
  if(!rowEl){render();return;} // row not on screen (e.g. filter changed) -> safe fallback
  btn.classList.toggle('on',e.paid);btn.textContent=e.paid?'✓':'';
  rowEl.classList.toggle('paid',e.paid);
  // refresh the "X of Y paid" summary + progress bar in place
  const scope=DB.expenses.filter(x=>x.month===curMonth()&&x.kind==='fixed');
  const paid=scope.filter(x=>x.paid);
  const tot=scope.reduce((s,x)=>s+x.amount,0), pd=paid.reduce((s,x)=>s+x.amount,0);
  const bar=document.querySelector('.bar > i');if(bar)bar.style.width=(tot?Math.round(pd/tot*100):0)+'%';
  const cnt=document.querySelector('[data-paidcount]');if(cnt)cnt.textContent=tab==='home'?`${paid.length} of ${scope.length} paid`:`${paid.length}/${scope.length} paid`;
  const amt=document.querySelector('[data-paidamt]');if(amt)amt.textContent=`${fmt(pd)} / ${fmt(tot)}`;
}

  // persist the ratio onto the person so it's the default next time
  const pers=DB.people.find(x=>x.name===person);if(pers){pers.commonPct=c;pers.personalPct=pp;}
  const clean=editFixed.filter(i=>i.n||i.a).map(i=>({k:i.k||uid(),n:i.n||'—',a:+i.a||0,t:i.t||'Expense'}));
  const o={person,salary,fixedItems:clean,month:curMonth()};
  if(id)Object.assign(DB.budgets.find(x=>x.id===id),o);else DB.budgets.push({id:uid(),...o});
  save();closeModal();render();
}

// --- Savings holding ---
function openSaving(id){
  const f=id?DB.savings.find(x=>x.id===id):{owner:DB.people[0]?.name||'',type:DB.savingsTypes[0],bank:'',amount:'',maturity:'',tenure:'',source:'Bank',status:'Running',phone:'',nominee:''};
  const types=DB.savingsTypes.map(t=>`<option ${t===f.type?'selected':''}>${esc(t)}</option>`).join('');
  openModal(`<h3>${id?'Edit':'Add'} savings</h3>
    <label>Type</label><select id="f_type">${types}</select>
    <label>Owner (actor)</label><select id="f_owner">${DB.people.map(p=>`<option ${p.name===f.owner?'selected':''}>${esc(p.name)}</option>`).join('')}${DB.people.some(p=>p.name===f.owner)?'':`<option selected>${esc(f.owner)}</option>`}</select>
    <label>Bank / Provider</label><input id="f_bank" value="${esc(f.bank)}">
    <label>Amount (₹)</label><input id="f_amount" type="number" inputmode="numeric" value="${f.amount}">
    <label>Maturity date (optional)</label><input id="f_mat" type="date" value="${f.maturity}">
    <label>Tenure</label><input id="f_ten" value="${esc(f.tenure)}" placeholder="1Y 6M">
    <label>Source</label><input id="f_src" value="${esc(f.source)}">
    <label>Status</label><select id="f_st"><option ${f.status==='Running'?'selected':''}>Running</option><option ${f.status==='Matured'?'selected':''}>Matured</option></select>
    <label>Phone</label><input id="f_ph" type="tel" value="${esc(f.phone)}">
    <label>Nominee</label><input id="f_nom" value="${esc(f.nominee)}">
    <div style="height:16px"></div><button class="btn" onclick="saveSaving('${id||''}')">Save</button>
    ${id?`<button class="del" onclick="delItem('savings','${id}')">Delete</button>`:''}`);
}
function saveSaving(id){
  const o={type:val('f_type'),owner:val('f_owner'),bank:val('f_bank'),amount:+val('f_amount')||0,maturity:val('f_mat'),
    tenure:val('f_ten')||'-',source:val('f_src'),status:val('f_st'),phone:val('f_ph'),nominee:val('f_nom')};
  if(id)Object.assign(DB.savings.find(x=>x.id===id),o);else DB.savings.push({id:uid(),...o});
  save();closeModal();render();
}
// --- Manage savings types ---
function openTypes(){
  openModal(`<h3>Savings types</h3><p class="muted sm">Used in the Type dropdown when adding a holding.</p>
    <div id="typeList"></div><button class="btn ghost sm" style="width:100%;margin-top:8px" onclick="addType()">+ Add type</button>
    <div style="height:14px"></div><button class="btn" onclick="saveTypes()">Done</button>`);
  renderTypeList();
}
function renderTypeList(){const el=document.getElementById('typeList');if(!el)return;
  el.innerHTML=DB.savingsTypes.map((t,ix)=>`<div class="subrow"><input value="${esc(t)}" oninput="DB.savingsTypes[${ix}]=this.value">
    <button class="x" onclick="DB.savingsTypes.splice(${ix},1);renderTypeList()">×</button></div>`).join('');}
function addType(){DB.savingsTypes.push('New type');renderTypeList();}
function saveTypes(){DB.savingsTypes=DB.savingsTypes.map(t=>(t||'').trim()).filter(Boolean);if(!DB.savingsTypes.length)DB.savingsTypes=['FD'];save();closeModal();render();}

function onFab(){
  if(tab==='expenses'){expTab==='extra'?openExtra():openExpense();}
  else if(tab==='split')openBudget();
  else if(tab==='savings')openSaving();
  else openExpense();
}

/* ============ profiles / actors ============ */
function openProfile(id){
  const p=id?DB.people.find(x=>x.id===id):{id:'',name:'',avatar:'🙂',color:'#5b8cff',commonPct:50,personalPct:50};
  const emojis=['👨🏻','👩🏻','👵🏻','🧓🏻','🧑🏻','👦🏻','👧🏻','🧔🏻','👴🏻','🐱','🐶'];
  const colors=['#5b8cff','#a78bfa','#3ddc97','#fb923c','#f472b6','#ffc44d','#ff6b7d'];
  openModal(`<h3>${id?'Edit':'Add'} actor</h3>
    <label>Name</label><input id="p_name" value="${esc(p.name)}">
    <label>Avatar</label><div id="p_avwrap" style="display:flex;flex-wrap:wrap;gap:8px">${emojis.map(e=>`<button class="ava big" style="border-color:${e===p.avatar?p.color:'var(--line)'}" onclick="document.getElementById('p_av').value='${e}';document.querySelectorAll('#p_avwrap .ava').forEach(x=>x.style.borderColor='var(--line)');this.style.borderColor='var(--accent)'">${e}</button>`).join('')}</div>
    <input type="hidden" id="p_av" value="${p.avatar}">
    <label>Colour</label><div style="display:flex;gap:8px">${colors.map(c=>`<button onclick="document.getElementById('p_color').value='${c}'" style="width:32px;height:32px;border-radius:9px;background:${c};border:2px solid ${c===p.color?'#fff':'transparent'}"></button>`).join('')}</div>
    <input type="hidden" id="p_color" value="${p.color}">
    <div class="row"><div style="flex:1"><label>Common savings %</label><input id="p_cpct" type="number" inputmode="numeric" value="${p.commonPct}" oninput="document.getElementById('p_ppct').value=Math.max(0,100-(+this.value||0))"></div>
      <div style="flex:1"><label>Personal savings %</label><input id="p_ppct" type="number" inputmode="numeric" value="${p.personalPct}"></div></div>
    <div style="height:16px"></div><button class="btn" onclick="saveProfile('${id||''}')">Save</button>
    ${id?`<button class="del" onclick="delProfile('${id}')">Delete actor</button>`:''}`);
}
function saveProfile(id){
  const name=val('p_name').trim();if(!name){alert('Name required');return;}
  const c=+val('p_cpct')||0;
  const o={name,avatar:val('p_av')||'🙂',color:val('p_color')||'#5b8cff',commonPct:c,personalPct:Math.max(0,100-c)};
  if(id){const old=DB.people.find(x=>x.id===id);const oldName=old.name;Object.assign(old,o);
    if(oldName!==name){ // cascade rename across data
      DB.budgets.forEach(b=>{if(b.person===oldName)b.person=name;});
      DB.expenses.forEach(e=>{if(e.paidBy===oldName)e.paidBy=name;});
      DB.savings.forEach(s=>{if(s.owner===oldName)s.owner=name;});
    }}
  else DB.people.push({id:'p_'+uid(),...o});
  save();closeModal();render();
}
function delProfile(id){
  const p=DB.people.find(x=>x.id===id);if(!p)return;
  const used=DB.budgets.some(b=>b.person===p.name)||DB.expenses.some(e=>e.paidBy===p.name)||DB.savings.some(s=>s.owner===p.name);
  if(used&&!confirm(`${p.name} is used in existing data. Delete the actor anyway? (their existing entries keep the name)`))return;
  DB.people=DB.people.filter(x=>x.id!==id);save();closeModal();render();
}

/* ============ backup: export / import ============ */
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='household-backup-'+istToday()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      let data;try{data=JSON.parse(rd.result);}catch(e){alert('That file is not valid JSON.');return;}
      if(!data||!Array.isArray(data.people)||!Array.isArray(data.expenses)){alert('This does not look like a Household backup.');return;}
      const counts=`${data.people.length} actors · ${data.budgets?.length||0} splits · ${data.expenses.length} expenses · ${data.savings?.length||0} savings`;
      if(!confirm(`Restore this backup?\n${counts}\n\nThis REPLACES your current data on this device (and syncs to the household).`))return;
      DB=data;migrate();DB.rev=(DB.rev||0)+1;DB.updatedAt=nowISO();
      lastSerialized=JSON.stringify(DB);localStorage.setItem(KEY,lastSerialized);
      syncPush();render();alert('Backup restored.');
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ============ render ============ */
function render(){
  const v={home:viewHome,split:viewSplit,expenses:viewExpenses,analytics:viewAnalytics,savings:viewSavings,sync:viewSync}[tab];
  document.getElementById('app').innerHTML=v();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.getElementById('fab').style.display=(tab==='home'||tab==='sync'||tab==='analytics')?'none':'flex';
  const eye=document.getElementById('eye');
  eye.innerHTML=hideMoney
    ? '<svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A9.9 9.9 0 0 1 12 5c5 0 9 4.5 10 7-.4 1-1.3 2.4-2.6 3.6M6.6 6.6C4.6 7.9 3.4 9.7 3 11c1 2.5 5 7 9 7 1.4 0 2.7-.3 3.9-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  eye.style.color=hideMoney?'var(--accent)':'var(--muted)';
  updateSyncBadge();window.scrollTo(0,0);
}

load();loadSync();render();
if(sync.enabled){startPull();syncPull(true);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sync.enabled)syncPull(true);});
window.addEventListener('focus',()=>{if(sync.enabled)syncPull(true);});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
